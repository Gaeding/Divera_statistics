workflows:
  flutter-ios-free:
    name: Flutter iOS Build
    max_build_duration: 30
    instance: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter build ipa
        script: |
          flutter build ipa --release --no-codesign
    artifacts:
      - build/ios/ipa/*.ipa