name: divera_stats
description: "DIVERA 24/7 Einsatzstatistik App"
publish_to: 'none'

version: 1.0.0+100

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.6.0
  intl: ^0.20.3
  fl_chart: ^1.2.0
  sqflite: ^2.4.2+1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  workmanager: ^0.10.9
  android_intent_plus: ^6.1.0
  file_picker: ^8.0.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1

# Ganz linksbündig einfügen (ohne Leerzeichen am Anfang)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png